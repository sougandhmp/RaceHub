// Types from outside this module that the Compose compiler cannot infer as stable.
// Only list types that are genuinely immutable: a wrong entry makes Compose skip
// recompositions it needs, which shows up as stale UI.

// Domain models from :shared. Every one is a class of `val`s (collections are
// read-only `List`s), so equal instances always render the same.
org.gce.racehub.auth.domain.model.*
org.gce.racehub.race.domain.model.*

// Read-only list interface. Lists handed to the UI are built with map/filter in
// :shared or the ViewModels and never mutated afterwards; keep it that way — pass a
// fresh list rather than mutating one already given to a composable.
kotlin.collections.List

// Shared presentation state (immutable data classes / enums / sealed intents).
org.gce.racehub.race.presentation.RaceState
org.gce.racehub.race.presentation.RaceIntent
org.gce.racehub.race.presentation.WeekendSession
org.gce.racehub.forum.presentation.ForumState
org.gce.racehub.forum.presentation.ForumIntent
org.gce.racehub.forum.presentation.ThreadDetailState
org.gce.racehub.forum.presentation.ThreadDetailIntent
org.gce.racehub.forum.presentation.CreateThreadState
org.gce.racehub.forum.presentation.CreateThreadIntent
org.gce.racehub.profile.presentation.ProfileState
org.gce.racehub.profile.presentation.ProfileIntent
org.gce.racehub.home.presentation.HomeState
org.gce.racehub.home.presentation.HomeTab
org.gce.racehub.home.presentation.HomeIntent
