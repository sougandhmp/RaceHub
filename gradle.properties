#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin Multiplatform
KOTLIN_FRAMEWORK_BUILD_TYPE=debug
kotlin.apple.xcodeCompatibility.nowarn=true

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=false
android.newDsl=false

#RaceHub API
# Base URL per build type, compiled into BuildConfig.API_BASE_URL (Android).
# Override for a build with -Pracehub.apiBaseUrl.release=https://...
# iOS sets its own in iosApp/Configuration/Config.xcconfig.
racehub.apiBaseUrl.debug=http://140.245.233.203:30018
racehub.apiBaseUrl.release=http://140.245.233.203:30018
