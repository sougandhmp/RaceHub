name: KMP CI Build

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  android-build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # Optional: Firebase Distribution
      - name: Upload to Firebase App Distribution
        if: success()
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute androidApp/build/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups testers \
            --token ${{ secrets.FIREBASE_TOKEN }}

  ios-build:
    if: github.event.pull_request.merged == true
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build shared KMP framework
        run: ./gradlew :shared:assembleXCFramework

      - name: Install CocoaPods dependencies
        run: |
          cd iosApp
          pod install

      - name: Build iOS App (Simulator)
        run: |
          cd iosApp
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build

      - name: Upload iOS Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ~/Library/Logs/DiagnosticReports
